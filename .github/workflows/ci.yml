name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node dist/cli.js --version

  runtime:
    # The published package is plain JavaScript and promises Node 18+.
    name: Built package runs on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g ./agent-baton-*.tgz
      - run: baton --version
      - run: baton --help
